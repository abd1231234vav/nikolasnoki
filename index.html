<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>nikolasnoki</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: #000;
      color: #e0e0e0;
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 4rem 0 2rem;
    }
    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    .hero p {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: #aaa;
      max-width: 560px;
      margin-bottom: 2rem;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 2rem;
      background: #fff;
      color: #000;
      font-size: 1rem;
      font-weight: 500;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .cta:hover { background: #ccc; }

    .features {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 2rem;
      padding: 4rem 0;
      border-top: 1px solid #222;
    }
    .feature {
      padding: 1.5rem;
      border-radius: 0.5rem;
      background: #111;
      transition: background 0.2s;
    }
    .feature:hover { background: #1a1a1a; }
    .feature h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    .feature p {
      font-size: 0.9rem;
      color: #888;
    }

    footer {
      text-align: center;
      padding: 2rem 0;
      border-top: 1px solid #222;
      color: #666;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1>nikolasnoki</h1>
      <p>developer. builder. problem solver.</p>
      <a href="#" class="cta">Get in touch &rarr;</a>
    </section>

    <section class="features">
      <div class="feature">
        <h3>Clean Code</h3>
        <p>Simple, readable, maintainable — the only way to build.</p>
      </div>
      <div class="feature">
        <h3>Fast Delivery</h3>
        <p>From idea to deployment without the fluff.</p>
      </div>
      <div class="feature">
        <h3>No Bloat</h3>
        <p>Just what you need, nothing you don't.</p>
      </div>
    </section>
  </main>

  <footer>
    <div class="container">&copy; 2026 nikolasnoki</div>
  </footer>
</body>
</html>
